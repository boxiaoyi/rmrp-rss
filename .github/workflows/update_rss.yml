name: 更新评论RSS

# 调度说明：
#   - schedule: 每天北京 08:17（UTC 00:17）与 20:17（UTC 12:17）各自动跑一次（依赖 GitHub 服务器，IP 在美国）
#   - workflow_dispatch: 也可在 Actions 页面手动点一下立即跑
# 注意「人民锐评」主源是人民网+ App 话题接口 3414（api-app.people.cn）。
#   该接口从美国 IP 可能取不到（静态页 436867 / 浙江宣传 / 人民日报评论 不受影响）。
#   所以本流程对人民锐评做了「接口失败就保留旧文件、绝不覆盖好内容」的保护，
#   跑完看日志里的 notice/warning 即可判断是否走通。
on:
  schedule:
    - cron: '17 0 * * *'          # 北京 08:17 每天自动
    - cron: '17 12 * * *'         # 北京 20:17 每天自动（当天新文基本不漏）
  workflow_dispatch:             # 手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 人民锐评：3414 App 接口（美 IP 可能取不到，故失败保留旧文件）
      - name: 生成人民锐评 RSS（3414 接口，失败则保留旧文件）
        run: |
          out=$(python3 rmrp_rss.py -o rmrp_new.xml 2>&1)
          echo "$out"
          if echo "$out" | grep -qE '\[api\] 话题返回 [1-9][0-9]* 篇'; then
            mv rmrp_new.xml rmrp.xml
            echo "::notice::人民锐评已更新（3414 接口正常）"
          else
            rm -f rmrp_new.xml
            git checkout -- rmrp.xml 2>/dev/null || true
            echo "::warning::3414 接口未取到内容，保留旧 rmrp.xml（不覆盖）"
          fi

      # 浙江宣传 / 人民日报评论：静态页，美 IP 安全
      - name: 生成浙江宣传 RSS
        run: python3 zjxc_rss.py -o zjxc.xml
      - name: 生成人民日报评论 RSS
        run: python3 rmrb_comment_rss.py -o rmrb_comment.xml
      - name: 生成求是网评 RSS
        run: python3 qs_comment_rss.py -o qs_comment.xml

      # 校验人民锐评篇数（异常不提交，避免覆盖好内容）
      - name: 校验人民锐评篇数
        run: |
          n=$(grep -c "<item>" rmrp.xml || true)
          echo "人民锐评篇数=$n"
          if [ "$n" -lt 20 ]; then
            echo "::error::人民锐评抓取异常($n篇)，终止提交"
            exit 1
          fi

      # 同步 lite/ 目录：jsDelivr 对已有路径的缓存最长可达 12h（purge 接口需签名，
      # 无签名的 purge 请求无效），lite/ 是新路径、首次访问实时回源，订阅端能立刻拿到最新。
      - name: 同步 lite/ 目录
        run: |
          mkdir -p lite
          cp rmrp.xml          lite/rmrp.xml
          cp zjxc.xml          lite/zjxc.xml
          cp rmrb_comment.xml  lite/rmrb_comment.xml
          cp qs_comment.xml    lite/qs_comment.xml
          ls -l lite/

      - name: 提交回仓库
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: 更新评论RSS $(date +%F)" || echo "无变化"
          git push

      - name: 刷新 jsDelivr 缓存
        if: success()
        run: |
          for f in rmrp.xml zjxc.xml rmrb_comment.xml qs_comment.xml; do
            curl -s "https://purge.jsdelivr.net/gh/boxiaoyi/rmrp-rss@main/$f" || true
          done
